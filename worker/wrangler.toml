name = "carte-stats"
main = "src/index.js"
compatibility_date = "2026-07-09"
account_id = "245083b0d8ad33c6546df4df78ddf412"

workers_dev = true

[observability]
enabled = true

# Synchronisation horaire des rendez-vous TidyCal (minute 17, pour éviter
# l'heure pile où tout le monde planifie).
[triggers]
crons = ["17 * * * *"]

[vars]
# Seule origine autorisée à déposer des événements.
ORIGINE_AUTORISEE = "https://dafffid.github.io"
# Nombre de jours affichés par défaut sur le tableau de bord.
FENETRE_JOURS = "30"

[[d1_databases]]
binding = "DB"
database_name = "carte-stats"
database_id = "297410aa-5fd7-40cb-aa35-e5947ce3eabc"

# Secrets à définir avec `wrangler secret put` (jamais dans ce fichier) :
#   MOTDEPASSE      mot de passe d'accès au tableau de bord
#   SECRET_SESSION  clé de signature du cookie de session admin
#   SEL_EMPREINTE   sel du hash quotidien anonymisant les visiteurs
#   TIDYCAL_TOKEN   jeton API TidyCal, lecture des réservations
