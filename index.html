<style>
:root {
  --brand: #1F2A63;

  --brand-deep: #141C48;
  --brand-soft: #1F2A6312;
  --accent: #F39448;
  --accent-deep: #E07E2E;
  --accent-soft: #F394481F;
  --ink: #17203F;
  --ink-2: #5A6178;
  --paper: #F3F5FA;
  --card: #FFFFFF;
  --line: #E2E6F0;
  --radius: 20px;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  background: var(--paper);
  color: var(--ink);
  min-height: 100vh;
  display: flex;
  justify-content: center;
  padding: 24px 16px 96px;
}
.carte { width: 100%; max-width: 420px; }

/* ---- Héro façon page d'accueil Symbotis : marine en dégradé ---- */
.hero {
  position: relative;
  overflow: hidden;
  border-radius: var(--radius) var(--radius) 0 0;
  background: linear-gradient(135deg, var(--brand-2) 0%, var(--brand) 45%, var(--brand-deep) 100%);
  color: #fff;
  text-align: center;
  padding: 26px 24px 26px;
}
.hero svg.reseau { position: absolute; inset: 0; width: 100%; height: 100%; }
.hero > * { position: relative; }
.logo-chip {
  display: inline-flex; align-items: center; justify-content: center;
  background: #fff;
  border-radius: 12px;
  padding: 8px 16px;
  box-shadow: 0 4px 14px #00000026;
}
.logo-chip { gap: 10px; }
.logo-chip img { height: 30px; display: block; }
.wordmark {
  font-weight: 700; font-size: 1.3rem;
  color: var(--brand); letter-spacing: 0.01em; line-height: 30px;
}
.wordmark .dot { color: var(--accent); }
.baseline {
  margin-top: 10px;
  font-size: 0.85rem;
  font-weight: 500;
  color: #FFFFFFCC;
  letter-spacing: 0.02em;
}
.expertises {
  display: flex; flex-wrap: wrap; justify-content: center; gap: 8px;
  margin-top: 16px;
}
.chip {
  font-size: 0.73rem;
  font-weight: 600;
  color: #fff;
  background: #FFFFFF1A;
  border: 1px solid #FFFFFF38;
  padding: 5px 12px;
  border-radius: 999px;
  backdrop-filter: blur(4px);
}

/* ---- Bloc identité ---- */
.entete {
  background: var(--card);
  border-radius: 0 0 var(--radius) var(--radius);
  padding: 0 24px 24px;
  text-align: center;
  box-shadow: 0 1px 3px #1F2A630D, 0 10px 30px #1F2A6314;
  border-top: 3px solid var(--accent);
}
.photo {
  position: relative;
  z-index: 2;
  width: 116px; height: 116px;
  border-radius: 50%;
  object-fit: cover;
  border: 4px solid var(--card);
  outline: 2px solid var(--accent);
  margin-top: -58px;
  background: var(--line);
  box-shadow: 0 4px 14px #1F2A6333;
}
h1 {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  font-weight: 700;
  font-size: 1.6rem;
  margin-top: 12px;
  color: var(--brand);
}
.fonction {
  color: var(--accent-deep);
  font-weight: 600;
  font-size: 0.88rem;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  margin-top: 5px;
}
.entreprise { color: var(--ink-2); font-size: 0.95rem; margin-top: 3px; font-weight: 500; }

/* ---- Boutons d'action rapide ---- */
.actions {
  display: flex; flex-wrap: wrap; justify-content: center;
  gap: 10px; margin-top: 20px;
}
.action { width: calc((100% - 30px) / 4); }
.action {
  display: flex; flex-direction: column; align-items: center; gap: 6px;
  text-decoration: none; color: var(--ink);
  font-size: 0.72rem; font-weight: 500;
}
.action .rond {
  width: 52px; height: 52px; border-radius: 50%;
  background: var(--brand-soft); color: var(--brand);
  display: flex; align-items: center; justify-content: center;
  transition: transform 0.15s ease, background 0.15s ease, color 0.15s ease;
}
.action:hover .rond, .action:focus-visible .rond {
  transform: translateY(-2px); background: var(--brand); color: #fff;
}
.action svg { width: 22px; height: 22px; }

/* ---- Bouton vCard (marine) ---- */
.btn-contact {
  display: flex; align-items: center; justify-content: center; gap: 10px;
  width: 100%; margin-top: 20px; padding: 15px;
  border: none; border-radius: 14px;
  background: var(--brand); color: #fff;
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  font-size: 0.98rem; font-weight: 600;
  cursor: pointer;
  transition: background 0.15s ease, transform 0.15s ease;
}
.btn-contact:hover { background: var(--brand-2); transform: translateY(-1px); }
.btn-contact svg { width: 20px; height: 20px; }

/* ---- CTA signature Symbotis (orange dégradé + mention) ---- */
.cta-rdv {
  display: block;
  margin-top: 12px;
  padding: 15px 18px;
  border-radius: 14px;
  background: linear-gradient(115deg, var(--accent), var(--accent-deep));
  color: #fff;
  text-decoration: none;
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  font-size: 0.95rem;
  font-weight: 600;
  line-height: 1.4;
  box-shadow: 0 6px 18px #F394484D;
  transition: transform 0.15s ease, box-shadow 0.15s ease;
}
.cta-rdv:hover { transform: translateY(-1px); box-shadow: 0 8px 22px #F3944866; }
.cta-mention {
  margin-top: 9px;
  font-size: 0.78rem;
  color: var(--ink-2);
}

/* ---- Sections ---- */
.section {
  background: var(--card);
  border-radius: var(--radius);
  padding: 20px 24px;
  margin-top: 16px;
  box-shadow: 0 1px 3px #1F2A630D;
}
.section h2 {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  font-size: 0.78rem; font-weight: 600;
  text-transform: uppercase; letter-spacing: 0.11em;
  color: var(--ink-2); margin-bottom: 14px;
}
.lien {
  display: flex; align-items: center; justify-content: space-between;
  padding: 13px 16px;

.qr-zone { text-align: center; }

  display: inline-block; padding: 12px;

.qr-note { color: var(--ink-2); font-size: 0.85rem; margin-top: 10px; }
.btn-partage {
  display: inline-flex; align-items: center; gap: 8px;

  border: 1.5px solid var(--accent); border-radius: 12px;

  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  font-size: 0.93rem; font-weight: 600;

  transition: background 0.15s ease, color 0.15s ease;
}
.btn-partage:hover { background: var(--accent); color: #fff; }
.btn-partage svg { width: 18px; height: 18px; }

/* ---- Pied de page façon footer Symbotis ---- */
footer {
  text-align: center;
  margin-top: 20px;

  border-radius: var(--radius);

footer .tagline { color: var(--accent); font-weight: 600; }

/* ---- Bouton flottant "📞 Prenons RDV" comme sur le site ---- */
.flottant {
  position: fixed;
  right: 16px; bottom: 16px;
  z-index: 10;

}

:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 6px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

<script>
/* ============================================================
   MOTEUR DE LA CARTE — aucune modification nécessaire
   ============================================================ */
const c = CONFIG;
const url = window.location.href.split("#")[0].split("?")[0];

/* ---- Analytics GoatCounter : compteurs anonymes, jamais bloquants ----
   Aucun cookie, aucun identifiant visiteur, aucune donnée personnelle.
   Si le script n'est pas chargé (hors-ligne, bloqueur, échec réseau),
   track() ne fait strictement rien et la page fonctionne à l'identique. */
function track(nom) {
  try {
    if (window.goatcounter && typeof window.goatcounter.count === "function") {
      window.goatcounter.count({ path: nom, event: true });
    }
  } catch (e) { /* l'analytics ne doit jamais casser la carte */ }
}

// URL de la carte suffixée du canal d'arrivée : ?src=qr, ?src=partage,
// ?src=vcard, ?src=sig (signature email). GoatCounter enregistre le
// paramètre de requête automatiquement, rien de plus à coder ici.
function urlCanal(src) { return url + "?src=" + src; }

// "Diagnostic digital gratuit" -> "diagnostic-digital-gratuit"
function slug(texte) {
  return String(texte).normalize("NFD").replace(/[\u0300-\u036f]/g, "")
    .toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "");
}

// Un seul écouteur, en phase de capture : l'événement part en parallèle du
// clic, sans preventDefault, donc aucune navigation n'est retardée ni bloquée
// (liens tel:, sms:, mailto:, externes compris).
document.addEventListener("click", (e) => {
  const cible = e.target && e.target.closest && e.target.closest("[data-ev]");
  if (cible) track(cible.getAttribute("data-ev"));
}, true);

// Couleurs de marque
document.documentElement.style.setProperty("--brand", c.couleur);
document.documentElement.style.setProperty("--brand-soft", c.couleur + "12");
document.documentElement.style.setProperty("--accent", c.couleurAccent);
document.documentElement.style.setProperty("--accent-soft", c.couleurAccent + "1F");

// Identité & héro
document.title = `${c.prenom} ${c.nom} — ${c.entreprise}`;
document.getElementById("wordmark").hidden = false;
if (c.logo) {
  const l = document.getElementById("logo");
  l.src = c.logo; l.hidden = false;
}
document.getElementById("baseline").textContent = c.baseline || "";
document.getElementById("nomComplet").textContent = `${c.prenom} ${c.nom}`;
document.getElementById("fonction").textContent = c.fonction;
document.getElementById("entreprise").textContent =
  [c.entreprise, c.ville].filter(Boolean).join(" · ");
document.getElementById("photo").src = c.photo;

// Badges des 4 domaines
if (c.expertises && c.expertises.length) {
  document.getElementById("expertises").innerHTML =
    c.expertises.map(e => `<span class="chip">${e}</span>`).join("");
}

// CTA signature RDV
if (c.rdv && c.rdv.url) {
  const cta = document.getElementById("ctaRdv");
  cta.href = c.rdv.url;
  cta.textContent = c.rdv.titre;
  document.getElementById("ctaMention").textContent = c.rdv.mention || "";
  document.getElementById("flottantRdv").href = c.rdv.url;
} else {
  document.getElementById("ctaRdv").hidden = true;
  document.getElementById("ctaMention").hidden = true;
  document.getElementById("flottantRdv").hidden = true;
}

// Citation
if (c.citation) {
  const q = document.getElementById("citation");
  q.textContent = c.citation;
  q.hidden = false;
}

// Pied de page façon footer Symbotis
document.getElementById("footer").innerHTML =
  `<div class="marque">${c.entreprise}</div>
   <div class="tagline">${c.tagline || ""}</div>
   <div>${c.domaines || ""}</div>
   <div>© ${new Date().getFullYear()} ${c.entreprise} — ${c.prenom} ${c.nom}. Tous droits réservés.</div>`;

// Icônes SVG
const ic = {
  tel: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3 19.5 19.5 0 0 1-6-6 19.8 19.8 0 0 1-3-8.7A2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 2 .7 3a2 2 0 0 1-.4 2.1L8.1 10a16 16 0 0 0 6 6l1.2-1.3a2 2 0 0 1 2.1-.4c1 .3 2 .6 3 .7a2 2 0 0 1 1.6 2z"/></svg>',
  sms: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>',
  mail: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-10 6L2 7"/></svg>',
  wa: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a10 10 0 0 0-8.6 15L2 22l5.2-1.4A10 10 0 1 0 12 2zm0 18.2c-1.5 0-3-.4-4.2-1.2l-.3-.2-3.1.8.8-3-.2-.3A8.2 8.2 0 1 1 12 20.2zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8-.2-.1-.4-.1-.6.1-.2.2-.6.8-.8 1-.1.2-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.3-.4 0-.5.2-.7l.4-.5c.1-.2.2-.3.3-.5v-.5c0-.1-.6-1.4-.8-1.9-.2-.5-.4-.4-.6-.4h-.5c-.2 0-.5.1-.7.3-.2.3-.9.9-.9 2.2s.9 2.5 1.1 2.7c.1.2 1.8 2.8 4.5 3.9.6.3 1.1.4 1.5.6.6.2 1.2.2 1.6.1.5-.1 1.5-.6 1.7-1.2.2-.6.2-1.1.2-1.2-.1-.1-.2-.2-.4-.3z"/></svg>',
  pin: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M20 10c0 6-8 12-8 12S4 16 4 10a8 8 0 0 1 16 0z"/><circle cx="12" cy="10" r="3"/></svg>',
  web: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15 15 0 0 1 0 20 15 15 0 0 1 0-20z"/></svg>',
  linkedin: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M20.4 20.4h-3.5v-5.6c0-1.3 0-3-1.9-3s-2.1 1.4-2.1 2.9v5.7H9.4V9h3.4v1.6h.1a3.7 3.7 0 0 1 3.3-1.8c3.6 0 4.2 2.3 4.2 5.4v6.2zM5.3 7.4a2 2 0 1 1 0-4.1 2 2 0 0 1 0 4.1zM7.1 20.4H3.6V9h3.5v11.4z"/></svg>',
  instagram: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="2" y="2" width="20" height="20" rx="5"/><circle cx="12" cy="12" r="4"/><line x1="17.5" y1="6.5" x2="17.5" y2="6.5"/></svg>',
  facebook: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M22 12a10 10 0 1 0-11.6 9.9v-7H7.9V12h2.5V9.8c0-2.5 1.5-3.9 3.8-3.9 1.1 0 2.2.2 2.2.2v2.5h-1.3c-1.2 0-1.6.8-1.6 1.6V12h2.8l-.4 2.9h-2.4v7A10 10 0 0 0 22 12z"/></svg>',
  x: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M18.9 2H22l-6.8 7.8L23.2 22h-6.3l-4.9-6.4L6.4 22H3.3l7.3-8.3L1.2 2h6.4l4.4 5.9L18.9 2zm-1.1 18.1h1.7L7 3.8H5.1l12.7 16.3z"/></svg>',
  youtube: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M23 7.2a3 3 0 0 0-2.1-2.1C19 4.5 12 4.5 12 4.5s-7 0-8.9.6A3 3 0 0 0 1 7.2 31 31 0 0 0 .5 12 31 31 0 0 0 1 16.8a3 3 0 0 0 2.1 2.1c1.9.6 8.9.6 8.9.6s7 0 8.9-.6a3 3 0 0 0 2.1-2.1A31 31 0 0 0 23.5 12 31 31 0 0 0 23 7.2zM9.8 15.5v-7l6 3.5-6 3.5z"/></svg>',
};

// Boutons d'action rapide
const actions = [];
if (c.telephone) actions.push({ t: "Appeler", h: "tel:" + c.telephone, i: ic.tel, ev: "clic-appeler" });
if (c.telephone) actions.push({ t: "SMS", h: "sms:" + c.telephone, i: ic.sms, ev: "clic-sms" });
if (c.email) actions.push({ t: "Email", h: "mailto:" + c.email, i: ic.mail, ev: "clic-email" });
if (c.whatsapp) actions.push({ t: "WhatsApp", h: "https://wa.me/" + c.whatsapp.replace(/[^0-9]/g, ""), i: ic.wa, ev: "clic-whatsapp" });
if (c.adresse) actions.push({ t: "Itinéraire", h: "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(c.adresse), i: ic.pin, ev: "clic-itineraire" });
if (c.siteWeb) actions.push({ t: "Site web", h: c.siteWeb, i: ic.web, ev: "clic-siteweb" });

document.getElementById("actions").innerHTML = actions.slice(0, 8).map(a =>
  `<a class="action" href="${a.h}" data-ev="${a.ev}" ${a.h.startsWith("http") ? 'target="_blank" rel="noopener"' : ""}>
     <span class="rond">${a.i}</span>${a.t}</a>`).join("");

// Liens de l'écosystème
if (c.liens && c.liens.length) {
  document.getElementById("sectionLiens").hidden = false;
  document.getElementById("liens").innerHTML = c.liens.map(l =>
    `<a class="lien" href="${l.url}" data-ev="lien-${slug(l.titre)}" target="_blank" rel="noopener">${l.titre}</a>`).join("");
}

// Réseaux sociaux
const reseaux = [
  ["linkedin", "LinkedIn"], ["instagram", "Instagram"],
  ["facebook", "Facebook"], ["x", "X"], ["youtube", "YouTube"],
].filter(([k]) => c[k]);
if (reseaux.length) {
  document.getElementById("sectionSocials").hidden = false;
  document.getElementById("socials").innerHTML = reseaux.map(([k, label]) =>
    `<a href="${c[k]}" data-ev="social-${k}" target="_blank" rel="noopener" aria-label="${label}">${ic[k]}</a>`).join("");
}

// QR code aux couleurs de la charte (généré localement, sans internet)
(function () {
  try {
    const qr = qrcode(0, "M");
    // Le QR encode l'URL suffixée ?src=qr pour distinguer ce canal dans les
    // stats ; l'adresse affichée sur la carte, elle, reste propre.
    qr.addData(urlCanal("qr"));
    qr.make();
    let svg = qr.createSvgTag({ cellSize: 4, margin: 0 })
      .replace(/fill="black"/g, 'fill="' + c.couleur + '"')
      .replace(/fill="white"/g, 'fill="#FFFFFF"')
      .replace("<svg ", '<svg style="width:168px;height:168px;display:block" ');
    document.getElementById("qrcode").innerHTML = svg;
    if (location.protocol === "file:") {
      document.querySelector(".qr-note").textContent =
        "Aperçu local : le QR pointera vers votre vraie adresse une fois la carte en ligne";
    }
  } catch (e) {
    document.getElementById("qrcode").innerHTML =
      '<p style="max-width:180px;font-size:0.8rem;color:#5A6178;margin:0">QR indisponible ici (' + e.message + ") — il s'affichera une fois la carte en ligne.</p>";
  }
})();

// vCard (.vcf)
function genererVcard() {
  const lignes = [
    "BEGIN:VCARD",
    "VERSION:3.0",
    `N:${c.nom};${c.prenom};;;`,
    `FN:${c.prenom} ${c.nom}`,
    c.entreprise && `ORG:${c.entreprise}`,
    c.fonction && `TITLE:${c.fonction}`,
    c.telephone && `TEL;TYPE=CELL:${c.telephone}`,
    c.email && `EMAIL:${c.email}`,
    c.siteWeb && `URL:${c.siteWeb}`,
    c.adresse && `ADR;TYPE=WORK:;;${c.adresse};;;;`,
    `NOTE:Carte de visite : ${urlCanal("vcard")}`,
    "END:VCARD",
  ].filter(Boolean).join("\r\n");
  const blob = new Blob([lignes], { type: "text/vcard;charset=utf-8" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `${c.prenom}-${c.nom}.vcf`.toLowerCase();
  a.click();
  URL.revokeObjectURL(a.href);
}
document.getElementById("btnVcard").addEventListener("click", genererVcard);

// Partage
function toast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("visible");
  setTimeout(() => t.classList.remove("visible"), 2200);
}
document.getElementById("btnPartage").addEventListener("click", async () => {
  // Tout ce qui sort par le bouton Partager porte ?src=partage
  const url = urlCanal("partage");
  const data = { title: `${c.prenom} ${c.nom}`, text: `Carte de visite de ${c.prenom} ${c.nom} — ${c.entreprise}`, url };
  // 1. Partage natif (mobile, ou desktop en HTTPS)
  if (navigator.share) {
    try { await navigator.share(data); return; }
    catch (e) { if (e.name === "AbortError") return; }
  }
  // 2. Presse-papiers moderne (HTTPS uniquement)
  if (navigator.clipboard && window.isSecureContext) {
    try {
      await navigator.clipboard.writeText(url);
      toast("Lien copié dans le presse-papiers");
      return;
    } catch (e) {}
  }
  // 3. Copie de repli : fonctionne aussi en local (file://)
  const ta = document.createElement("textarea");
  ta.value = url;
  ta.style.position = "fixed"; ta.style.opacity = "0";
  document.body.appendChild(ta);
  ta.select();
  let ok = false;
  try { ok = document.execCommand("copy"); } catch (e) {}
  ta.remove();
  if (ok) { toast("Lien copié dans le presse-papiers"); return; }
  // 4. Ultime recours, sans boîte de dialogue (interdite dans certains
  //    environnements) : afficher le lien dans un champ à copier soi-même
  const champ = document.getElementById("lienManuel");
  champ.value = url;
  champ.hidden = false;
  try { champ.focus(); champ.select(); } catch (e) {}
  toast("Copiez le lien ci-dessus");
});

// Mode hors-ligne (PWA) : après une première visite en ligne, la carte
// reste consultable sans connexion. Actif uniquement en http(s).
if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
  navigator.serviceWorker.register("sw.js").catch(() => {});
}
</script>

<!-- Statistiques anonymes GoatCounter : pas de cookie, pas d'identifiant
     visiteur, aucune donnée personnelle. Chargement async et optionnel :
     hors-ligne ou script bloqué, la carte fonctionne à l'identique. -->
<script data-goatcounter="https://card-david-servais.goatcounter.com/count"
        async src="https://gc.zgo.at/count.js"></script>
</body>
